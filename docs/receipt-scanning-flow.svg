<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="330" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">Proposed receipt scanning flow</text>

  <g stroke="#475569" stroke-width="2" marker-end="url(#arrow)" fill="none">
    <path d="M170 120H200"/>
    <path d="M350 120H380"/>
    <path d="M530 120H560"/>
    <path d="M710 120H740"/>
    <path d="M820 160V200"/>
    <path d="M740 235H710"/>
  </g>

  <g font-size="13" fill="#0f172a" text-anchor="middle">
    <rect x="20" y="85" width="150" height="70" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="95" y="115" font-weight="600">1. Capture</text>
    <text x="95" y="135">Camera / upload</text>

    <rect x="200" y="85" width="150" height="70" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="275" y="115" font-weight="600">2. Preprocess</text>
    <text x="275" y="135">Resize, compress, crop</text>

    <rect x="380" y="85" width="150" height="70" rx="10" fill="#fef3c7" stroke="#d97706"/>
    <text x="455" y="115" font-weight="600">3. Send to API</text>
    <text x="455" y="135">Multipart image POST</text>

    <rect x="560" y="85" width="150" height="70" rx="10" fill="#fef3c7" stroke="#d97706"/>
    <text x="635" y="115" font-weight="600">4. OCR / Vision</text>
    <text x="635" y="135">Extract text and fields</text>

    <rect x="740" y="85" width="150" height="70" rx="10" fill="#fef3c7" stroke="#d97706"/>
    <text x="815" y="115" font-weight="600">5. Parse</text>
    <text x="815" y="135">Merchant, date, total</text>

    <rect x="740" y="200" width="150" height="70" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="815" y="230" font-weight="600">6. Prefill form</text>
    <text x="815" y="250">Transaction dialog</text>

    <rect x="530" y="200" width="180" height="70" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="620" y="230" font-weight="600">7. User confirms</text>
    <text x="620" y="250">Edit, then save + attach</text>
  </g>

  <g font-size="12" fill="#475569">
    <rect x="20" y="205" width="14" height="14" fill="#e0f2fe" stroke="#0284c7"/><text x="42" y="217">Frontend</text>
    <rect x="110" y="205" width="14" height="14" fill="#fef3c7" stroke="#d97706"/><text x="132" y="217">Backend</text>
    <rect x="200" y="205" width="14" height="14" fill="#dcfce7" stroke="#16a34a"/><text x="222" y="217">Frontend (review)</text>
  </g>
</svg>
